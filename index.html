<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sokohub Market</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      font-size: 18px;
      margin-bottom: 0;
    }

    .cart {
      background: white;
      margin: 20px;
      padding: 18px;
      text-align: center;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .product {
      background: white;
      padding: 20px;
      text-align: center;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .emoji {
      font-size: 60px;
    }

    .product h2 {
      margin: 10px 0;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      margin: 15px 0;
    }

    button {
      background: #16a34a;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.95);
    }

    footer {
      background: #111827;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🛍️ Sokohub Market</h1>
    <p>Nunua na uza bidhaa kwa urahisi</p>
  </header>

  <div class="cart">
    🛒 Kikapu: <span id="count">0</span> bidhaa
    <br>
    Jumla: TZS <span id="total">0</span>
  </div>

  <div class="products">

    <div class="product">
      <div class="emoji">👕</div>
      <h2>Nguo</h2>
      <div class="price">TZS 35,000</div>
      <button onclick="addToCart(35000)">
        Nunua
      </button>
    </div>

    <div class="product">
      <div class="emoji">🎧</div>
      <h2>Headphones</h2>
      <div class="price">TZS 45,000</div>
      <button onclick="addToCart(45000)">
        Nunua
      </button>
    </div>

    <div class="product">
      <div class="emoji">📱</div>
      <h2>Simu</h2>
      <div class="price">TZS 50,000</div>
      <button onclick="addToCart(50000)">
        Nunua
      </button>
    </div>

  </div>

  <footer>
    © 2026 Sokohub Market
    <br>
    Marketplace ya kununua na kuuza
  </footer>

  <script>
    let count = 0;
    let total = 0;

    function addToCart(price) {
      count = count + 1;
      total = total + price;

      document.getElementById("count").textContent = count;
      document.getElementById("total").textContent =
        total.toLocaleString("en-US");
    }
  </script>

</body>
</html>
